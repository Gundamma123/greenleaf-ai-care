
name: GreenLeaf AI Care - CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: greenleaf-ai-care-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: greenleaf-ai-care-main/package-lock.json

      - name: Clean install dependencies
        run: |
          rm -rf node_modules
          npm install --include=optional

      - name: Build frontend
        run: npm run build
